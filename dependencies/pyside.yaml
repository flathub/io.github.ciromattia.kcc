name: pyside
buildsystem: simple
build-options:
  env:
    LLVM_INSTALL_DIR: /usr/lib/sdk/llvm21
  append-path: /usr/lib/sdk/llvm21/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm21/lib
cleanup:
  - /bin
build-commands:
  - python3 setup.py install --prefix $FLATPAK_DEST --limited-api=no --qtpaths=/usr/bin/qtpaths6
    --no-qt-tools --log-level=verbose

sources:
  - type: git
    url: https://github.com/qtproject/pyside-pyside-setup.git
    tag: v6.10.3
    commit: 863e6b6e6269fbd401db06e2066119b9014fcf0d

  - type: shell
    commands:
      - sed -i -e 's|PYSIDE_TREAT_QT_INCLUDE_DIRS_AS_NON_SYSTEM|1|g' sources/pyside6/cmake/Macros/PySideModules.cmake

modules:
  - name: patchelf
    buildsystem: autotools
    cleanup: ['*']
    sources:
      - type: git
        url: https://github.com/NixOS/patchelf.git
        tag: 0.18.0
        commit: 99c24238981b7b1084313aca8f5c493bb46f302c

  - name: python3-packaging
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "flit-core>=3.9.0" --no-build-isolation
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "packaging>=24.1" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/46/ef/34533186e76c526d9ec17a1ad9a10c7354cbfb20f51583cc36dfe4bdccd0/flit_core-4.0.2.tar.gz
        sha256: b6929defd93884b584d7c87829e0e7b5c26ed6be17b0b873979019314aa841c8
        x-checker-data:
          type: pypi
          name: flit-core
      - type: file
        url: https://files.pythonhosted.org/packages/7d/fa/3944b40b07da9ce895c0e6303a5ab7d53da063554f534556b134a54d6093/packaging-26.3.tar.gz
        sha256: 94edc256424af38762eb31306eed28beb9f0efc50a8837492c9d6fd6004aed79
        x-checker-data:
          type: pypi
          name: packaging
